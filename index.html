<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PythonGroup - Cargando...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap');

  :root {
    --pink: #ff4fa3;
    --cyan: #00eeff;
    --yellow: #ffe94f;
    --purple: #b44fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at top left, #1a0a2e 0%, #080818 50%, #000510 100%);
    font-family: 'Nunito', sans-serif;
    color: #fff;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: grid;
    grid-template-rows: 1fr auto;
    grid-template-columns: 1fr 340px;
    position: relative;
  }

  /* Grid background */
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,238,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,238,255,0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 10s linear infinite;
    z-index: 0;
  }
  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 50px 50px; }
  }

  /* Glow blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    animation: blobPulse 5s ease-in-out infinite alternate;
    z-index: 0;
    pointer-events: none;
  }
  .blob1 { width: 500px; height: 500px; background: var(--pink); opacity: 0.18; top: -150px; left: -150px; }
  .blob2 { width: 450px; height: 450px; background: var(--cyan); opacity: 0.15; bottom: -100px; right: 300px; animation-delay: 2s; }
  .blob3 { width: 350px; height: 350px; background: var(--purple); opacity: 0.2; top: 30%; right: -100px; animation-delay: 1s; }
  .blob4 { width: 250px; height: 250px; background: var(--yellow); opacity: 0.1; bottom: 20%; left: 30%; animation-delay: 3s; }
  @keyframes blobPulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.15); }
  }

  /* Particles */
  .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(100vh) scale(0); }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-40px) scale(1); }
  }

  /* Scanlines */
  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px);
    pointer-events: none; z-index: 200;
  }

  /* ===== LEFT PANEL ===== */
  .left-panel {
    grid-row: 1 / 3;
    grid-column: 1;
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px 50px;
  }

  /* Top: logo */
  .logo-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeLeft 0.8s ease both;
  }
  @keyframes fadeLeft {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .logo-icon {
    font-size: 72px;
    line-height: 1;
    filter: drop-shadow(0 0 24px var(--cyan));
    animation: iconBounce 3s ease-in-out infinite;
  }
  @keyframes iconBounce {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-10px) rotate(4deg); }
  }

  .logo-text { display: flex; flex-direction: column; gap: 2px; }

  .server-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    line-height: 1;
    background: linear-gradient(90deg, var(--pink), var(--cyan), var(--yellow), var(--pink));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbowShift 4s linear infinite;
  }
  @keyframes rainbowShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .server-sub {
    font-size: 12px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-weight: 700;
  }

  /* Divider */
  .divider {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, var(--pink), var(--cyan));
    border-radius: 99px;
    margin-top: 4px;
    box-shadow: 0 0 10px var(--cyan);
  }

  /* Middle: big map display */
  .map-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    animation: fadeLeft 0.8s 0.2s ease both;
  }

  .map-label {
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-weight: 700;
  }

  .map-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 56px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 2px;
    text-shadow: 0 0 30px rgba(0,238,255,0.5);
    line-height: 1;
  }

  .map-gamemode {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Bottom: tip */
  .tip-section {
    animation: fadeLeft 0.8s 0.4s ease both;
  }

  .tip {
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
    line-height: 1.6;
    border-left: 2px solid var(--pink);
    padding-left: 12px;
  }
  .tip span { color: var(--pink); font-weight: 700; }

  /* ===== RIGHT PANEL ===== */
  .right-panel {
    grid-row: 1 / 3;
    grid-column: 2;
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 40px 30px 40px 10px;
    border-left: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.2);
    backdrop-filter: blur(20px);
    animation: fadeRight 0.8s ease both;
  }
  @keyframes fadeRight {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Stat cards */
  .stat-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.3s, background 0.3s;
  }
  .stat-card:hover {
    border-color: rgba(0,238,255,0.2);
    background: rgba(255,255,255,0.06);
  }

  .stat-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-icon { font-size: 16px; }
  .stat-label {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-weight: 700;
  }

  .stat-value {
    font-family: 'Rajdhani', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1;
  }

  .stat-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }

  .players-bar {
    height: 3px;
    background: rgba(255,255,255,0.07);
    border-radius: 99px;
    overflow: hidden;
  }
  .players-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--cyan));
    border-radius: 99px;
    transition: width 1s ease;
    box-shadow: 0 0 6px var(--cyan);
  }

  .ping-good { color: var(--yellow); }
  .ping-mid { color: #ff9f4f; }
  .ping-bad { color: #ff4f4f; }

  /* Progress section */
  .progress-section {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .progress-title {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-weight: 700;
  }

  .progress-pct {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--cyan);
  }

  .progress-wrap {
    height: 6px;
    background: rgba(255,255,255,0.07);
    border-radius: 99px;
    overflow: visible;
    position: relative;
  }

  .progress-bar {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--pink), var(--cyan));
    width: 0%;
    transition: width 0.4s ease;
    box-shadow: 0 0 10px var(--cyan);
    position: relative;
  }
  .progress-bar::after {
    content: '';
    position: absolute;
    right: -5px; top: 50%;
    transform: translateY(-50%);
    width: 10px; height: 10px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px var(--cyan), 0 0 16px var(--cyan);
  }

  .status-text {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
    text-align: center;
  }

  .dots span {
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    animation: dotBounce 1.2s ease-in-out infinite;
    margin: 0 2px;
    vertical-align: middle;
  }
  .dots span:nth-child(1) { background: var(--pink); }
  .dots span:nth-child(2) { background: var(--cyan); animation-delay: 0.2s; }
  .dots span:nth-child(3) { background: var(--yellow); animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
    40% { transform: scale(1.3); opacity: 1; }
  }

  /* Decorative corner lines */
  .corner {
    position: fixed;
    width: 60px; height: 60px;
    z-index: 5;
    pointer-events: none;
  }
  .corner-tl { top: 20px; left: 20px; border-top: 2px solid rgba(0,238,255,0.3); border-left: 2px solid rgba(0,238,255,0.3); }
  .corner-tr { top: 20px; right: 20px; border-top: 2px solid rgba(255,79,163,0.3); border-right: 2px solid rgba(255,79,163,0.3); }
  .corner-bl { bottom: 20px; left: 20px; border-bottom: 2px solid rgba(255,79,163,0.3); border-left: 2px solid rgba(255,79,163,0.3); }
  .corner-br { bottom: 20px; right: 20px; border-bottom: 2px solid rgba(0,238,255,0.3); border-right: 2px solid rgba(0,238,255,0.3); }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>
<div class="scanlines"></div>
<div class="particles" id="particles"></div>
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<!-- LEFT -->
<div class="left-panel">
  <div class="logo-section">
    <div class="logo-row">
      <div class="logo-icon">🐍</div>
      <div class="logo-text">
        <div class="server-name">PythonGroup</div>
        <div class="server-sub">Garry's Mod Server</div>
      </div>
    </div>
    <div class="divider"></div>
  </div>

  <div class="map-section">
    <div class="map-label">📍 Jugando ahora</div>
    <div class="map-name" id="mapName">gm_construct</div>
    <div class="map-gamemode" id="gamemodeText">Sandbox</div>
  </div>

  <div class="tip-section">
    <div class="tip">
      Bienvenido a <span>PythonGroup</span><br>
      Usa <span>!shop</span> para abrir la tienda de puntos<br>
      Usa <span>!ulx</span> si eres admin
    </div>
  </div>
</div>

<!-- RIGHT -->
<div class="right-panel">
  <div class="stat-card">
    <div class="stat-header">
      <span class="stat-icon">👥</span>
      <span class="stat-label">Jugadores</span>
    </div>
    <div class="stat-value">
      <span style="color:var(--pink)" id="curPlayers">0</span>
      <span style="color:rgba(255,255,255,0.2);font-size:18px"> / </span>
      <span style="color:var(--cyan)" id="maxPlayers">16</span>
    </div>
    <div class="players-bar"><div class="players-fill" id="playersFill" style="width:0%"></div></div>
    <div class="stat-sub" id="playersSub">Servidor vacío</div>
  </div>

  <div class="stat-card">
    <div class="stat-header">
      <span class="stat-icon">📡</span>
      <span class="stat-label">Ping</span>
    </div>
    <div class="stat-value ping-good" id="pingValue">--</div>
    <div class="stat-sub">milisegundos</div>
  </div>

  <div class="stat-card">
    <div class="stat-header">
      <span class="stat-icon">🌐</span>
      <span class="stat-label">Servidor</span>
    </div>
    <div class="stat-value" style="font-size:16px;color:rgba(255,255,255,0.6)">159.112.138.246</div>
    <div class="stat-sub">:27015 • Santiago, CL</div>
  </div>

  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-title">Progreso de carga</span>
      <span class="progress-pct" id="progressText">0%</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">
      Conectando <div class="dots" style="display:inline"><span></span><span></span><span></span></div>
    </div>
  </div>
</div>

<script>
  // Particles
  const pContainer = document.getElementById('particles');
  const colors = ['#ff4fa3','#00eeff','#ffe94f','#b44fff'];
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    const size = Math.random() * 3 + 1.5;
    p.style.width = p.style.height = size + 'px';
    p.style.animationDuration = (Math.random() * 10 + 7) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    pContainer.appendChild(p);
  }

  // URL params
  const params = new URLSearchParams(window.location.search);
  const map = params.get('map') || 'gm_construct';
  const players = parseInt(params.get('players') || '0');
  const maxplayers = parseInt(params.get('maxplayers') || '16');
  const gamemode = params.get('gamemode') || 'Sandbox';

  document.getElementById('mapName').textContent = map;
  document.getElementById('gamemodeText').textContent = gamemode.charAt(0).toUpperCase() + gamemode.slice(1);
  document.getElementById('curPlayers').textContent = players;
  document.getElementById('maxPlayers').textContent = maxplayers;
  document.getElementById('playersFill').style.width = (players / maxplayers * 100) + '%';
  document.getElementById('playersSub').textContent = players === 0 ? 'Servidor vacío' : players + ' jugador' + (players > 1 ? 'es' : '') + ' en línea';

  // Ping
  async function measurePing() {
    try {
      const t0 = performance.now();
      await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
      const ping = Math.round(performance.now() - t0);
      const el = document.getElementById('pingValue');
      el.textContent = ping;
      el.className = 'stat-value ' + (ping < 80 ? 'ping-good' : ping < 150 ? 'ping-mid' : 'ping-bad');
    } catch(e) {}
  }
  measurePing();
  setInterval(measurePing, 3000);

  // Progress
  const statuses = [
    "Conectando al servidor...",
    "Descargando recursos...",
    "Cargando addons...",
    "Inicializando Lua...",
    "Casi listo...",
    "¡Entrando al juego! 🎉"
  ];

  let progress = 0;
  const bar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const statusText = document.getElementById('statusText');

  function updateProgress() {
    if (typeof gameui !== 'undefined' && gameui.GetProgressPercent) {
      progress = gameui.GetProgressPercent();
    } else {
      progress = Math.min(progress + Math.random() * 2, 100);
    }
    bar.style.width = progress + '%';
    progressText.textContent = Math.floor(progress) + '%';
    statusText.textContent = statuses[Math.min(Math.floor(progress / 17), statuses.length - 1)];
    if (progress < 100) requestAnimationFrame(updateProgress);
  }
  setTimeout(updateProgress, 300);
</script>
</body>
</html>
